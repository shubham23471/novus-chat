[pytest]
pythonpath = .
testpaths = backend/tests

# Filter out warnings from third-party dependencies
filterwarnings =
    # Ignore deprecation warnings from pyiceberg (third-party dependency)
    ignore::DeprecationWarning:pyiceberg.*
    # Ignore deprecation warnings from supabase client (third-party dependency)
    ignore::DeprecationWarning:supabase.*
    # Keep all other warnings (from your own code)
    default::DeprecationWarning